stages:
  data_ingestion:
      cmd: python src/data_ingestion.py
      deps: 
        - src/data_ingestion.py
      outs:
        - data/preprocessed_data.csv

  feature_engineering:
      cmd: python src/feature_engineering.py
      deps:
        - src/feature_engineering.py
        - data/preprocessed_data.csv
      outs:
        - data/tokenized_test
        - data/tokenized_train
        - ./saved_tokenizer

  model_training:
      cmd: python src/build_model.py
      deps:
        - src/build_model.py
        - data/tokenized_train
        - data/tokenized_test
        - ./saved_tokenizer
      outs:
        - models/distillbert
  
  model_evaluation:
      cmd: python src/model_evaluation.py
      deps:
        - src/model_evaluation.py
        - models/distillbert
        - data/tokenized_test
      metrics:
        - metrics.json
      outs:
        - eval_results